<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Abramyan | Systems & Game Software Engineer</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #12161f;
            --bg-card: #181d28;
            --border-color: #272f3f;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --code-bg: #0d1117;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent);
            font-family: var(--font-mono);
            margin-top: 0.25rem;
        }

        .bio {
            margin-top: 1rem;
            color: var(--text-muted);
            max-width: 750px;
        }

        .links {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .links a:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* Project Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-preview {
            width: 100%;
            height: 180px;
            background: var(--code-bg);
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .card-preview img, .card-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
        }

        .card-btn {
            align-self: start;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .card-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Modal Details Window */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 100;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--accent);
        }

        .modal-media {
            margin-top: 1rem;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .modal-media img, .modal-media video {
            max-width: 100%;
            max-height: 420px;
            object-fit: contain;
            display: block;
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            overflow-x: auto;
            margin-top: 1rem;
            color: #d2a8ff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Arthur Abramyan</h1>
        <div class="subtitle">Computer Science & Systems Software Engineer</div>
        <p class="bio">
            Specializing in low-level systems programming (C++), deterministic flight software architectures, hardware telemetry, and real-time graphics/Godot engine mechanics.
        </p>
        <div class="links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="mailto:email@example.com">Contact Email</a>
            <a href="#">Resume (PDF)</a>
        </div>
    </header>

    <div class="controls">
        <button class="filter-btn active" onclick="filterProjects('all', event)">All Work</button>
        <button class="filter-btn" onclick="filterProjects('systems', event)">Systems & Embedded</button>
        <button class="filter-btn" onclick="filterProjects('gamedev', event)">Graphics & Game Engines</button>
    </div>

    <div class="grid" id="projectGrid"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <h2 id="modalTitle" style="margin-bottom: 0.5rem;"></h2>
        <div id="modalTags" class="tech-stack"></div>
        <div id="modalMedia" class="modal-media"></div>
        <p id="modalDescription" style="color: var(--text-muted); margin-top: 1rem;"></p>
        <div id="modalCode"></div>
    </div>
</div>

<script>
    const projects = [
        {
            id: "godot-water-shader",
            category: "gamedev",
            title: "Stylized 3D Spatial Water Shader",
            shortDesc: "Custom spatial shader in Godot 4 utilizing vertex wave displacement, depth fade, and dynamic foam generation.",
            tags: ["Godot 4", "GDScript", "GLSL Shaders", "3D Graphics"],
            fullDesc: "Implemented a custom spatial wave displacement shader utilizing linear depth sampling from the depth buffer to generate edge foam contacts and smooth shoreline blending.",
            mediaType: "video",
            mediaSrc: "assets/shaders/water_demo.mp4",
            thumbnail: "assets/shaders/water_thumb.png",
            codeSnippet: `shader_type spatial;\nrender_mode depth_draw_always, cull_back;\n\nuniform sampler2D DEPTH_TEXTURE : hint_depth_texture;\nvoid fragment() {\n    float depth = texture(DEPTH_TEXTURE, SCREEN_UV).r;\n    // Shoreline intersection calculation...\n}`
        },
        {
            id: "fprime-flight",
            category: "systems",
            title: "Embedded Satellite Telemetry Component",
            shortDesc: "NASA F Prime component architecture built in C++ for deterministic flight software telemetry logging.",
            tags: ["C++", "NASA F Prime", "Embedded Systems", "Linux"],
            fullDesc: "Designed and integrated custom telemetry-handling components into NASA's F Prime framework. Implemented thread-safe queueing for ground command deserialization and deterministic rate-group execution.",
            mediaType: "image",
            mediaSrc: "assets/diagrams/fprime_architecture.png",
            thumbnail: "assets/diagrams/fprime_architecture.png",
            codeSnippet: `// F Prime Telemetry Port Handler\nvoid TelemetryComponent :: runHandler(const NATIVE_INT_TYPE portNum, U32 val) {\n    FW_ASSERT(portNum < NUM_RUN_INPUT_PORTS);\n    this->tlmWrite_PacketsSent(val);\n}`
        },
        {
            id: "dc-sensor-pcb",
            category: "systems",
            title: "DC High-Current Sensing Board & Firmware",
            shortDesc: "Custom PCB design using Hall-effect sensing coupled with C++ firmware for real-time EV current monitoring.",
            tags: ["C++", "KiCad", "Embedded Hardware", "UART"],
            fullDesc: "Engineered hardware schematics and low-level firmware for continuous direct current measurements across 15V power paths using a precision shunt and analog signal conditioning.",
            mediaType: "image",
            mediaSrc: "assets/pcb/board_layout.png",
            thumbnail: "assets/pcb/board_layout.png",
            codeSnippet: `// Sensor Sampling ADC Loop\nfloat read_dc_amps() {\n    uint16_t raw_adc = analogRead(CURRENT_PIN);\n    float voltage = (raw_adc / 4095.0f) * VREF;\n    return (voltage - V_OFFSET) / SENSITIVITY;\n}`
        },
        {
            id: "merchant-sim",
            category: "gamedev",
            title: "Data-Driven Market Engine & Game",
            shortDesc: "Economic simulation game featuring custom ItemData resources and dynamic price-fluctuation state machines.",
            tags: ["Godot 4", "GDScript", "Architecture", "Game Design"],
            fullDesc: "Constructed an item management system using custom Godot Resource wrappers (`ItemData`) to decouple market engine data handling from UI rendering components.",
            mediaType: "video",
            mediaSrc: "assets/merchant/gameplay.mp4",
            thumbnail: "assets/merchant/thumb.png",
            codeSnippet: `class_name ItemData extends Resource\n\n@export var item_id: String\n@export var base_value: float\n@export var volatility: float`
        }
    ];

    function renderProjects(items) {
        const grid = document.getElementById('projectGrid');
        grid.innerHTML = items.map(p => {
            let previewMedia = '';
            if (p.thumbnail) {
                previewMedia = `<img src="${p.thumbnail}" alt="${p.title}">`;
            } else if (p.mediaType === 'video') {
                previewMedia = `<video src="${p.mediaSrc}" autoplay loop muted playsinline></video>`;
            } else if (p.mediaType === 'image') {
                previewMedia = `<img src="${p.mediaSrc}" alt="${p.title}">`;
            } else {
                previewMedia = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-family:var(--font-mono);">&lt;/&gt; Preview</div>`;
            }

            return `
                <div class="card">
                    <div class="card-preview">${previewMedia}</div>
                    <div class="card-body">
                        <h3 class="card-title">${p.title}</h3>
                        <p class="card-description">${p.shortDesc}</p>
                        <div class="tech-stack">
                            ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <button class="card-btn" onclick="openModal('${p.id}')">View Details &rarr;</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterProjects(category, event) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (category === 'all') {
            renderProjects(projects);
        } else {
            renderProjects(projects.filter(p => p.category === category));
        }
    }

    function openModal(id) {
        const p = projects.find(item => item.id === id);
        if (!p) return;

        document.getElementById('modalTitle').innerText = p.title;
        document.getElementById('modalTags').innerHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
        document.getElementById('modalDescription').innerText = p.fullDesc;
        document.getElementById('modalCode').innerHTML = p.codeSnippet ? `<pre><code>${escapeHtml(p.codeSnippet)}</code></pre>` : '';

        const mediaContainer = document.getElementById('modalMedia');
        if (p.mediaType === 'video') {
            mediaContainer.innerHTML = `<video src="${p.mediaSrc}" controls autoplay></video>`;
            mediaContainer.style.display = 'flex';
        } else if (p.mediaType === 'image') {
            mediaContainer.innerHTML = `<img src="${p.mediaSrc}" alt="${p.title}">`;
            mediaContainer.style.display = 'flex';
        } else {
            mediaContainer.innerHTML = '';
            mediaContainer.style.display = 'none';
        }

        document.getElementById('modalBackdrop').classList.add('active');
    }

    function hideModal() {
        const backdrop = document.getElementById('modalBackdrop');
        backdrop.classList.remove('active');
        // Stop playing video in modal when closed
        document.getElementById('modalMedia').innerHTML = '';
    }

    function closeModal(e) {
        if (e.target.id === 'modalBackdrop') hideModal();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial Render
    renderProjects(projects);
</script>

</body>
</html>
